[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-timetabling"
version = "1.0.0"
description = "Genetic Algorithm Course Scheduling & Timetabling System with Repair Transformer"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Nguyen Duc Trung"}
]
dependencies = [
    "numpy>=1.20.0",
    "openpyxl>=3.0.0",
    "matplotlib>=3.5.0",
    "streamlit>=1.20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
markers = [
    "unit: Quick unit tests for isolated classes, models, and utility functions",
    "integration: Integration tests combining multiple components or engine runs",
    "slow: Benchmarks or multi-seed tests that take longer to run",
]

