version: '3.8'

services:
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ga_timetabling_benchmark
    env_file:
      - .env.example
    volumes:
      - ./outputs:/app/outputs
    command: python main_benchmark.py --mode report

  test-ga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ga_timetabling_test
    env_file:
      - .env.example
    volumes:
      - ./outputs:/app/outputs
    command: python scripts/run_ga_demo.py
